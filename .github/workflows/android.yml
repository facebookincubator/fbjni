name: Android CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: 17
        distribution: 'zulu'
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
    - name: Build with Gradle
      run: ./gradlew assembleDebug
    - name: Verify Prefab package name
      run: |
        unzip -p fbjni-android/build/outputs/aar/fbjni-debug.aar prefab/prefab.json | grep -Fq '"name": "fbjni"'
    - name: Run tests
      run: scripts/run-host-tests.sh
